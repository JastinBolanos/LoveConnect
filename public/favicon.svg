<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="borderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <radialGradient id="innerBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2c1052" />
      <stop offset="100%" stop-color="#140626" />
    </radialGradient>
    <filter id="heartGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#ec4899" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- Outer rounded container -->
  <rect x="5" y="7" width="52" height="52" rx="15" fill="url(#innerBg)" stroke="url(#borderGrad)" stroke-width="3.5" />
  
  <!-- Subtle glass highlight top edge -->
  <path d="M9 19 C9 14 13 10 19 10 L43 10 C49 10 53 14 53 19 C45 22 20 22 9 19 Z" fill="#ffffff" opacity="0.1" />

  <!-- Center Heart with white glowing rim and pink fill -->
  <path d="M31 46 C31 46 17 36.5 17 27.5 C17 22.5 20.8 19 25.5 19 C28.3 19 30.7 20.6 31 22.2 C31.3 20.6 33.7 19 36.5 19 C41.2 19 45 22.5 45 27.5 C45 36.5 31 46 31 46 Z"
        fill="#ec4899"
        stroke="#ffffff"
        stroke-width="2.5"
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#heartGlow)" />

  <!-- Sparkle 4-point star in top-right -->
  <path d="M53 3 C53 8 55 10 60 10 C55 10 53 12 53 17 C53 12 51 10 46 10 C51 10 53 8 53 3 Z"
        fill="#facc15" />
  <circle cx="53" cy="10" r="1.5" fill="#fffef0" />
</svg>
